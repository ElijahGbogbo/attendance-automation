name: Client CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Build client
        run: npm run build
