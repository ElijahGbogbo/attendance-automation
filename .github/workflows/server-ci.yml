name: Server CI

on:
  push:
    branches:
      - main       // This branch is for Production deployment
      - develop    // This branch is for Development deployment
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'


jobs:
  lint-and-build:
    name: Lint and build server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

